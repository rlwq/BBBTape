name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and verify all proofs
        run: lake build

      - name: Check axioms
        run: |
          output=$({
            echo "import Bf"
            for f in $(ls Bf/Results/BB*.lean | sort -V); do
              n=$(basename "$f" .lean | tr 'A-Z' 'a-z')
              echo "#print axioms Bf.$n"
            done
          } | lake env lean --stdin)
          echo "$output"
          if echo "$output" | grep -q 'sorryAx'; then
            echo "::error::sorryAx found in BB theorems!"
            exit 1
          fi
